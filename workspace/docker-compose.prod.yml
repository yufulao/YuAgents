services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://oa.yodaze.com}
        NEXT_PUBLIC_WORKSPACE_CREATION_ENABLED: ${NEXT_PUBLIC_WORKSPACE_CREATION_ENABLED:-false}
        NEXT_PUBLIC_WORKSPACE_DIRECTORY_ENABLED: ${NEXT_PUBLIC_WORKSPACE_DIRECTORY_ENABLED:-false}

  nginx:
    image: nginx:alpine
    ports:
      - "${REMOTE_WEB_BIND:-127.0.0.1}:${REMOTE_WEB_PORT:-18080}:80"
    environment:
      LOCAL_CONTROL_API_URL: ${LOCAL_CONTROL_API_URL:-http://host.docker.internal:8000}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
